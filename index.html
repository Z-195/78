<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>🎂 张贺亭 生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;color:#fff;font-family:system-ui}
#box{width:100vw;height:100vh;position:relative}
canvas{display:block}
.start{
    position:absolute;inset:0;
    background:rgba(0,0,0,0.9);
    z-index:99;
    display:flex;align-items:center;justify-content:center;
}
.start button{
    padding:16px 32px;font-size:20px;border:none;border-radius:999px;
    background:#ff6677;color:#fff;cursor:pointer;
}
.ctrl{
    position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
    display:flex;gap:12px;z-index:10;display:none;
}
.ctrl button{padding:10px 20px;border:none;border-radius:999px;font-size:16px}
#blow{background:#ff7878;color:#fff}
#blow:disabled{background:#555}
#reset{background:#fff;color:#222}
.tip{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);padding:6px 14px;border-radius:999px;font-size:14px;z-index:10;display:none}
.happy{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.2);opacity:0;
    font-size:clamp(2rem,10vw,5rem);font-weight:bold;color:#ffdd44;
    text-shadow:0 0 16px #ff9922,0 0 32px #ff5522;
    z-index:20;pointer-events:none;transition:0.8s ease-out;
}
.happy.show{transform:translate(-50%,-50%) scale(1);opacity:1}
</style>
</head>
<body>
<div id="box">
    <div class="start" id="startDiv">
        <button id="startBtn">🎂 点击开始</button>
    </div>
    <div class="tip" id="tip">对着麦克风吹气吹灭蜡烛</div>
    <div class="ctrl" id="ctrlDiv">
        <button id="blow">吹气</button>
        <button id="reset">重置</button>
    </div>
    <div class="happy" id="happyText">张贺亭 生日快乐！</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const startDiv = document.getElementById('startDiv');
const startBtn = document.getElementById('startBtn');
const tip = document.getElementById('tip');
const ctrlDiv = document.getElementById('ctrlDiv');
const blowBtn = document.getElementById('blow');
const resetBtn = document.getElementById('reset');
const happyText = document.getElementById('happyText');

let scene, camera, renderer;
let flameList = [];
let state = 'WAITING';
const threshold = 0.18;
let audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3');
audio.volume = 0.6;
const candlePositions = [[0,0,0],[0.7,0,0],[-0.7,0,0],[0,0,0.7],[0,0,-0.7]];

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 3, 5.2);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    document.getElementById('box').appendChild(renderer.domElement);

    const amb = new THREE.AmbientLight(0xffffff, 0.5);
    const pl1 = new THREE.PointLight(0xfffdf0, 0.8, 20);
    pl1.position.set(3,3,3);
    scene.add(amb, pl1);

    // 蛋糕
    const cakeGroup = new THREE.Group();
    const cakeGeo = new THREE.CylinderGeometry(2.2,2.2,1,10);
    const cakeMat = new THREE.MeshStandardMaterial({color:0xf8c898});
    const cakeMesh = new THREE.Mesh(cakeGeo, cakeMat);
    cakeMesh.position.y = 0.5;
    cakeGroup.add(cakeMesh);

    const creamGeo = new THREE.CylinderGeometry(2.15,2.15,0.35,10);
    const creamMat = new THREE.MeshStandardMaterial({color:0xfff2f8});
    const cream = new THREE.Mesh(creamGeo, creamMat);
    cream.position.y = 1.18;
    cakeGroup.add(cream);

    // 糖珠
    const dotPos = [[-1.2,1.22,0],[1.2,1.22,0],[0,1.22,1.2],[0,1.22,-1.2]];
    const dotColors = [0xff5577,0x55ddff,0xffee55,0x77ff77];
    dotPos.forEach((p,i)=>{
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.07,3,3), new THREE.MeshStandardMaterial({color:dotColors[i]}));
        m.position.set(p[0],p[1],p[2]);
        cakeGroup.add(m);
    })

    // 蜡烛火焰
    candlePositions.forEach(p=>{
        const g = new THREE.Group();
        g.position.set(p[0], 0, p[2]);
        const candleMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.07,0.07,0.7,6),
            new THREE.MeshStandardMaterial({color:0xfff8ee})
        );
        candleMesh.position.y = 1.18;
        g.add(candleMesh);

        const flameMesh = new THREE.Mesh(
            new THREE.ConeGeometry(0.06,0.22,5),
            new THREE.MeshStandardMaterial({color:0xffaa33,emissive:0xff7722,emissiveIntensity:1.1})
        );
        flameMesh.position.y = 1.62;
        g.add(flameMesh);
        flameList.push(flameMesh);
        cakeGroup.add(g);
    })
    scene.add(cakeGroup);
    animate();
}

function addSmoke(x,y,z){
    for(let i=0;i<12;i++){
        const s = new THREE.Mesh(
            new THREE.SphereGeometry(0.04,3,3),
            new THREE.MeshStandardMaterial({color:0xdddddd,transparent:true,opacity:0.6})
        );
        s.position.set(x,y,z);
        s.userData = {vx:(Math.random()-0.5)*0.012,vy:Math.random()*0.02+0.01,life:1};
        scene.add(s);
    }
}

function addConfetti(){
    const cc = [0xff4466,0xffdd44,0x44ddff,0x77ff77];
    for(let i=0;i<28;i++){
        const m = new THREE.Mesh(
            new THREE.PlaneGeometry(0.08,0.04),
            new THREE.MeshStandardMaterial({color:cc[i%cc.length],side:THREE.DoubleSide,transparent:true})
        );
        m.position.set((Math.random()-0.5)*2,1.4,(Math.random()-0.5)*2);
        m.userData = {vx:(Math.random()-0.5)*0.06,vy:Math.random()*0.07+0.03,rz:Math.random()*Math.PI*2,life:1};
        scene.add(m);
    }
}

function blowAction(){
    if(state !== 'WAITING') return;
    state = 'BLOWING';
    blowBtn.disabled = true;
    setTimeout(()=>{
        state = 'BLOWN';
        flameList.forEach(f=>f.visible=false);
        candlePositions.forEach(p=>addSmoke(p[0],1.62,p[2]));
        addConfetti();
        audio.currentTime = 0;
        audio.play().catch(e=>{});
        happyText.classList.add('show');
    },1200);
}

function resetAction(){
    state = 'WAITING';
    blowBtn.disabled = false;
    happyText.classList.remove('show');
    flameList.forEach(f=>f.visible=true);
    scene.children.forEach(obj=>{
        if(obj.userData.life) scene.remove(obj);
    })
}

async function openMic(){
    try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const src = audioCtx.createMediaStreamSource(stream);
        src.connect(analyser);
        const arr = new Uint8Array(analyser.frequencyBinCount);
        function micLoop(){
            if(state !== 'WAITING'){requestAnimationFrame(micLoop);return;}
            analyser.getByteFrequencyData(arr);
            let sum = 0;
            for(let v of arr) sum += v;
            const avg = sum / arr.length / 255;
            if(avg > threshold) blowAction();
            requestAnimationFrame(micLoop);
        }
        micLoop();
    }catch(e){
        console.log("麦克风授权失败，只用按钮吹气");
    }
}

function animate(){
    requestAnimationFrame(animate);
    scene.children.forEach(obj=>{
        if(!obj.userData.life) return;
        obj.position.x += obj.userData.vx;
        obj.position.y += obj.userData.vy - 0.003;
        obj.rotation.z += 0.06;
        obj.userData.life -= 0.007;
        obj.material.opacity = obj.userData.life;
        if(obj.userData.life <= 0) scene.remove(obj);
    })
    renderer.render(scene,camera);
}

window.onresize = ()=>{
    if(!camera||!renderer) return;
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
}

blowBtn.onclick = blowAction;
resetBtn.onclick = resetAction;

startBtn.onclick = async ()=>{
    startDiv.style.display = 'none';
    tip.style.display = 'block';
    ctrlDiv.style.display = 'flex';
    init();
    await openMic();
}
</script>
</body>
</html>
